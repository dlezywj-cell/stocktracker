name: Update Stock Data

on:
  schedule:
    # 北京时间周一至周六 06:00-10:00 每小时补查一次，周日不运行。
    # 北京时间跨 UTC 日期，需拆成两条。
    # 06:00、07:00 = 前一日 UTC 22:00、23:00；08:00-10:00 = 当日 UTC 00:00-02:00。
    - cron: '0 22,23 * * 0-5'
    - cron: '0 0-2 * * 1-6'
    # 北京时间 15:17-23:17 每小时检查一次。日报一旦发布，下一次任务即写入；
    # 即使 GitHub 排队到次日，脚本也只接受来源日期明确的数据，不会再误标日期。
    - cron: '17 7-15 * * 1-5'
  workflow_dispatch:

# 解决 Node.js 20 警告的环境变量
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 稍微提高下 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install akshare pandas requests

    - name: Run data fetch script
      env:
        TZ: Asia/Shanghai
      run: python update_data.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        git add .
        
        # 优化提交逻辑：只在有 .json 变更时提交
        if git diff --staged --quiet; then
          echo "No changes detected in industry_data.json"
        else
          git commit -m "Auto update industry data: $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin main
          echo "Push successful!"
        fi
