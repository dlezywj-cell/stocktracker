name: Update Stock Data

on:
  schedule:
    # GitHub Actions 的定时任务可能排队延后；在非整点的低峰时段
    # 连续三次提前启动，确保北京时间 09:30 前已尝试获取上一交易日收盘数据。
    # UTC 周日到周四的 21:17、22:17、23:17 = 北京时间周一到周五的 05:17、06:17、07:17。
    - cron: '17 21,22,23 * * 0-4'
    # 北京时间 15:07-18:57 每 10 分钟检查一次。日报一旦发布，下一次任务即写入；
    # 即使 GitHub 排队到次日，脚本也只接受来源日期明确的数据，不会再误标日期。
    - cron: '7,17,27,37,47,57 7-10 * * 1-5'
    # 晚间继续补查，覆盖申万偶发的延迟发布。
    - cron: '17 11-15 * * 1-5'
  workflow_dispatch:

# 解决 Node.js 20 警告的环境变量
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 稍微提高下 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install akshare pandas requests

    - name: Run data fetch script
      env:
        TZ: Asia/Shanghai
      run: python update_data.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        git add .
        
        # 优化提交逻辑：只在有 .json 变更时提交
        if git diff --staged --quiet; then
          echo "No changes detected in industry_data.json"
        else
          git commit -m "Auto update industry data: $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin main
          echo "Push successful!"
        fi
